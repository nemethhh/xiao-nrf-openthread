#
# XIAO nRF52840 (xiao_ble) as a permanent Thread router: shell and console over the native USB
# CDC ACM port (the board DTS already chooses board_cdc_acm_uart for console and shell).
# Mirrors NCS's samples/openthread/cli/boards/nrf52840dongle_nrf52840.conf, minus the dongle's
# bootloader-reset GPIO (the XIAO's Adafruit UF2 bootloader is entered by double-tapping reset).
#
# Headless: nothing waits for a host. USB comes up at boot on its own, OpenThread starts from main()
# when a dataset is stored, and the shell only holds its output until a host asserts DTR
# (SHELL_BACKEND_SERIAL_CHECK_DTR, the board default) instead of blocking on an absent reader.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Seeed Studio"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="XIAO nRF52840 Thread Router"
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
# The shell backend must initialise after the CDC ACM device (as in the NCS dongle config).
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
# USB delivers a pasted line in 64-byte bursts, faster than the shell drains them: with the default 64-byte
# RX ring the rest of a long line is dropped (seen live: `ot dataset set active <tlv>` lost everything after
# 64 characters, no Done, no error). Hold a whole command buffer (SHELL_CMD_BUFF_SIZE=416 in prj.conf).
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
# tools/fw.py reboots a running router into the UF2 bootloader through `devmem` (GPREGRET = 0x57), so
# re-flashing needs no reset double-tap. Enabled by default here already; explicit because the tool relies on it.
CONFIG_DEVMEM_SHELL=y
