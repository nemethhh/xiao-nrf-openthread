# Same as the NCS coprocessor sample's nRF54L15 DK config.
CONFIG_SPI_NOR=n
CONFIG_MAIN_STACK_SIZE=2048

# uart20 carries Spinel only: nothing else may write to it.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SHELL=n

# The board DTS powers (rfsw-pwr, P2.3 high) and selects (rfsw-ctl, P2.5 low = on-board ceramic antenna)
# the RF switch through regulator-fixed nodes; prj.conf's CONFIG_GPIO=n (from the NCS sample) would leave
# both pins undriven. GPIO enables the fixed-regulator driver (CONFIG_REGULATOR_FIXED defaults on with it).
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
