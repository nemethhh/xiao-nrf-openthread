# nRF52840 fallback RCP: Spinel over native USB CDC ACM (no UART, no flow-control problem).
# Mirrors the NCS coprocessor sample's boards/nrf52840dongle_nrf52840.conf, minus the dongle's
# bootloader-reset GPIO. Used with EXTRA_CONF_FILE for TARGETS["rcp-xiao52"].
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Nordic Semiconductor ASA"
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Thread Co-Processor"
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x0000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=400
CONFIG_UART_LINE_CTRL=y

# The CDC port carries Spinel only.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
